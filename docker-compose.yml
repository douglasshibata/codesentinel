services:
  codesentinel-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codesentinel-api
    ports:
      - "8080:8080"
    environment:
      - DB_TYPE=postgres
      - DSN=postgres://codesentinel:codesentinel@postgres:5432/codesentinel?sslmode=disable
      - PRIVACY_MODE=false
      - LLM_PROVIDER=mock
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: codesentinel-db
    environment:
      POSTGRES_USER: codesentinel
      POSTGRES_PASSWORD: codesentinel
      POSTGRES_DB: codesentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: codesentinel-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
